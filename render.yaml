# Render blueprint. Connect the repo, then set the secrets in the dashboard.
#
# Local disk on a hosted container is ephemeral - it is wiped on every deploy - so all
# frames, models and records go to R2. Set the R2 vars or teammates will lose their work.
services:
  - type: web
    name: betareal-scan-studio
    runtime: docker            # Python + Node; the optimise stage needs glTF-Transform
    dockerfilePath: ./Dockerfile
    plan: free                    # sleeps after ~15 min idle; first hit then takes ~1 min
                                  # to wake. Upgrade to `starter` ($7) if the wait annoys
                                  # the team - it is a one-line change and a redeploy.
    healthCheckPath: /healthz
    envVars:
      - key: MESHY_API_KEY        # one shared key, one shared credit pool
        sync: false
      - key: STUDIO_USERS         # temo:pw,niko:pw,gio:pw  - who did what is recorded
        sync: false
      - key: R2_ENDPOINT          # paste from the R2 token screen, e.g.
        sync: false               # https://<account-id>.r2.cloudflarestorage.com
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_PHOTOS
        value: betareal-photos
      - key: R2_BUCKET_MODELS
        value: betareal-models
