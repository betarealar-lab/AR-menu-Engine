<!doctype html>
<meta charset="utf-8">
<!-- viewport-fit=cover so the bottom tab bar can sit under the iOS home indicator
     rather than above a white strip. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scan Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  /* A colour-judgement instrument. The chrome is true neutral - equal R, G and B at every
     step - so nothing on screen biases how a dish reads. The only saturated colour here
     should be the food. Verdict marks are the exception: grease pencil, and only there. */
  :root{
    --void:#151515; --bench:#1e1e1e; --plate:#262626; --raise:#2f2f2f;
    --rule:#383838; --rule-lit:#4a4a4a;
    --ink:#e4e4e4; --ink-dim:#8c8c8c; --ink-faint:#5f5f5f;
    --chalk:#f0ede7; --amber:#d99a2b; --red:#c4402f;
    --pad:20px;
    --label:600 10px/1 'Archivo',sans-serif;
    --track:.16em;
  }
  *{box-sizing:border-box;margin:0}
  /* Author styles beat the UA sheet's [hidden] rule regardless of specificity, so any
     class carrying its own `display` silently ignores el.hidden. That is how the
     Shipping/Master tabs stayed on screen for dishes with nothing to ship. */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{background:var(--void);color:var(--ink);
       font:400 14px/1.55 'Archivo',system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;overflow:hidden}
  .lbl{font:var(--label);letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-dim)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

  button,select,input,textarea{font:inherit;color:var(--ink);background:var(--raise);
    border:1px solid var(--rule);border-radius:2px;padding:7px 12px}
  button{cursor:pointer;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:#3a3a3a;border-color:var(--rule-lit)}
  button:disabled{opacity:.35;cursor:not-allowed}
  :focus-visible{outline:2px solid var(--chalk);outline-offset:2px}

  .run{background:var(--chalk);color:#151515;border-color:transparent;font-weight:600;
       letter-spacing:.08em;text-transform:uppercase;font-size:11px;padding:8px 18px}
  .run:hover:not(:disabled){background:#fff}

  /* ── frame ─────────────────────────────────────────────── */
  header{display:flex;align-items:center;gap:10px;height:54px;padding:0 var(--pad);
         border-bottom:1px solid var(--rule);background:var(--bench)}
  .wordmark{font:700 12px/1 'Archivo',sans-serif;letter-spacing:.2em;text-transform:uppercase;
            margin-right:6px}
  .wordmark span{color:var(--ink-faint)}
  .sp{flex:1}
  #status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);
          max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  main{display:grid;grid-template-columns:216px 1fr;height:calc(100% - 54px)}

  /* ── specimen list ─────────────────────────────────────── */
  aside{border-right:1px solid var(--rule);background:var(--bench);overflow:auto;
        padding:16px 0}
  aside .lbl{padding:0 var(--pad) 10px;display:block}
  .spec{display:block;width:100%;text-align:left;background:none;border:0;border-radius:0;
        padding:8px var(--pad);cursor:pointer}
  .spec:hover{background:var(--plate)}
  .spec[aria-current="true"]{background:var(--plate);box-shadow:inset 2px 0 0 var(--chalk)}
  .spec b{font-weight:500;display:block;font-size:13px}
  .spec small{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint)}
  .newdish{margin:12px var(--pad) 0;width:calc(100% - var(--pad)*2);font-size:12px}

  /* ── bench ─────────────────────────────────────────────── */
  .bench{display:grid;grid-template-rows:1fr auto;overflow:hidden}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:var(--pad);
           padding:var(--pad);overflow:auto;min-height:0}
  .panel{display:flex;flex-direction:column;min-height:0}
  .panel > header{all:unset;display:flex;align-items:baseline;gap:10px;
                  padding-bottom:9px;margin-bottom:11px;border-bottom:1px solid var(--rule)}

  /* The input plate: four frames butted into one object with hairline gutters, because
     Meshy receives them as one ordered array, not four files. */
  .plate{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
         gap:1px;background:var(--rule);border:1px solid var(--rule);
         aspect-ratio:1;min-height:0}
  .cell{position:relative;background:var(--plate);cursor:pointer;overflow:hidden;
        display:grid;place-items:center}
  .cell.over{background:var(--raise);box-shadow:inset 0 0 0 2px var(--chalk)}
  .cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cell .no{position:absolute;top:8px;left:9px;z-index:2;font-family:'IBM Plex Mono',monospace;
            font-size:10px;color:var(--chalk);text-shadow:0 1px 3px #000c;letter-spacing:.06em}
  .cell .role{position:absolute;bottom:8px;left:9px;right:9px;z-index:2;font:var(--label);
              letter-spacing:var(--track);text-transform:uppercase;color:#fff;
              text-shadow:0 1px 3px #000c}
  .cell .drop{color:var(--ink-faint);font-size:12px;text-align:center;padding:0 12px}
  .cell.primary .no,.cell.primary .role{color:var(--amber)}
  .cell .x{position:absolute;top:5px;right:5px;z-index:3;padding:2px 7px;font-size:11px;
           background:#000a;border-color:transparent;opacity:0;transition:opacity .12s}
  .cell:hover .x{opacity:1}

  .platefoot{display:flex;justify-content:space-between;align-items:center;
             padding-top:9px;font-family:'IBM Plex Mono',monospace;font-size:11px;
             color:var(--ink-faint)}

  /* ── result ────────────────────────────────────────────── */
  .stage{flex:1;min-height:0;border:1px solid var(--rule);background:
         repeating-conic-gradient(#232323 0% 25%,#1c1c1c 0% 50%) 50%/22px 22px;
         display:grid;place-items:center;position:relative;overflow:hidden}
  model-viewer{width:100%;height:100%;--poster-color:transparent}
  .stage{position:relative}
  .mvstate{position:absolute;left:0;right:0;bottom:10px;display:flex;gap:8px;
    align-items:center;justify-content:center;font-size:12px;color:var(--ink-faint);
    pointer-events:none;text-align:center;padding:0 16px}
  .mvstate.bad{color:var(--red);pointer-events:auto}
  .stagemsg{text-align:center;padding:28px;max-width:340px}
  .stagemsg p{color:var(--ink-faint);font-size:13px;margin-top:6px}
  .err{color:var(--red);font-family:'IBM Plex Mono',monospace;font-size:12px;
       white-space:pre-wrap;text-align:left}
  .spinner{width:26px;height:26px;border:2px solid var(--rule-lit);border-top-color:var(--chalk);
           border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── verdict rail ──────────────────────────────────────── */
  .rail{border-top:1px solid var(--rule);background:var(--bench);
        padding:14px var(--pad);display:grid;grid-template-columns:auto 1fr;
        gap:10px 22px;align-items:start}
  .rail .lbl{padding-top:7px}
  .marks{display:flex;gap:8px}
  .mark{border:1px solid var(--rule);background:transparent;font-size:12px;padding:6px 16px;
        letter-spacing:.04em}
  .mark[aria-pressed="true"]{color:#151515;border-color:transparent;font-weight:600}
  .mark.good[aria-pressed="true"]{background:var(--chalk)}
  .mark.ok[aria-pressed="true"]{background:var(--amber)}
  .mark.no[aria-pressed="true"]{background:var(--red);color:#fff}
  .faults{display:flex;flex-wrap:wrap;gap:6px}
  .fault{border:1px solid var(--rule);background:transparent;color:var(--ink-dim);
         font-size:11.5px;padding:5px 11px;border-radius:2px}
  .fault[aria-pressed="true"]{background:var(--red);border-color:transparent;color:#fff}
  .exportrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .scalerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .scalerow input[type=number]{width:88px;text-align:right;
    font-family:'IBM Plex Mono',monospace}
  .scalerow select{max-width:172px}
  .scalerow .unit{color:var(--ink-faint);font-size:12px;margin-left:-4px}
  /* Amber, not red: an unsized model is not broken, it is unfinished. */
  #scalecm.unset{border-color:var(--amber)}
  .minitab{font:500 10px/1 'Archivo',sans-serif;letter-spacing:.09em;text-transform:uppercase;
           padding:5px 10px;background:transparent;color:var(--ink-dim)}
  .minitab[aria-pressed="true"]{background:var(--raise);border-color:var(--rule-lit);
           color:var(--chalk)}
  .stagetabs{display:flex;gap:4px}
  /* Credits are the tightest limit in the system, so they are shown next to the button
     that spends them, and turn amber then red as they run out. */
  button.ghost{background:transparent;color:var(--ink-dim)}
  /* Over the thumbnail, not under the text: these are occasional actions and they were
     taking a full row of every card for it. Hidden until the card is hovered or
     keyboard-focused, so a wall of cards stays a wall of dishes. */
  body.norail aside{display:none}
  body.norail main{grid-template-columns:1fr}
  .photogrid{padding:16px 20px 28px;display:flex;flex-direction:column;gap:20px;
             overflow:auto}
  .phrow{border:1px solid var(--rule);border-radius:3px;background:var(--bench)}
  .phrow.archived{opacity:.5}
  .phhead{padding:10px 12px;border-bottom:1px solid var(--rule);
          display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
  .phhead b{font-weight:600;font-size:13px}
  .phshots{display:flex;gap:10px;padding:12px;flex-wrap:wrap}
  .shotcard{width:150px;margin:0}
  .shotcard img{width:150px;height:150px;object-fit:cover;border-radius:2px;
                background:var(--plate);display:block}
  .shotcard figcaption{display:flex;gap:6px;align-items:center;justify-content:space-between;
                       padding-top:5px;font-size:10.5px;color:var(--ink-faint);
                       font-family:'IBM Plex Mono',monospace}
  /* A predicted frame is marked on the picture itself, not only in a caption: it is the
     difference between a photograph of the dish and a guess about it. */
  .shotcard.predicted img{outline:1px solid var(--amber);outline-offset:-1px}
  .predtag{color:var(--amber);text-transform:uppercase;letter-spacing:.06em;font-size:9.5px}
  .cardacts{position:absolute;top:6px;right:6px;display:flex;gap:4px;
            opacity:0;transition:opacity .12s;z-index:2}
  .card:hover .cardacts,.card:focus-within .cardacts{opacity:1}
  /* A word beats a glyph here. Every icon considered for "archive" - a box, an arrow,
     a crossed eye - needed its own tooltip to be understood, and a 30px word does not. */
  .iconbtn{height:22px;min-width:22px;padding:0 7px;line-height:1;font-size:10.5px;
           letter-spacing:.04em;display:grid;place-items:center;border-radius:3px;
           background:rgba(0,0,0,.7);border:1px solid var(--rule-lit);color:var(--chalk)}
  .iconbtn:hover{background:rgba(0,0,0,.85)}
  .iconbtn.danger:hover{border-color:var(--red);color:var(--red)}
  /* Touch has no hover, so on a phone they are simply always visible. */
  @media (hover:none){.cardacts{opacity:1}}
  .warnpill{font-size:11.5px;color:var(--amber);max-width:340px;line-height:1.35}
  .run.risky{border-color:var(--amber)}
  #credits{font-size:11.5px;color:var(--ink-dim);white-space:nowrap}
  #credits.low{color:var(--amber)} #credits.out{color:var(--red)}
  #queue{font-size:11.5px;color:var(--ink-dim);white-space:nowrap}
  #queue.busy{color:var(--ink)} #queue.dead{color:var(--red)}
  .hintline{font-size:12px;color:var(--ink-faint)}
  .hintline.warn{color:var(--amber)}
  .hintline.ok{color:var(--chalk)}
  .rail textarea{width:100%;min-height:34px;max-height:90px;resize:vertical;
                 background:var(--plate);font-size:13px}

  .viewtab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:7px 13px;
           background:transparent}
  .viewtab[aria-pressed="true"]{background:var(--raise);border-color:var(--rule-lit);color:var(--chalk)}
  #library{height:calc(100% - 54px);overflow:auto;padding:var(--pad);
           display:flex;flex-direction:column;gap:16px}
  .libbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font:500 12px/1 'Archivo',sans-serif;padding:7px 13px;border:1px solid var(--rule);
        background:var(--plate);color:var(--ink-dim);border-radius:99px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--chalk);color:#151515;border-color:transparent;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .card{position:relative;cursor:pointer;text-align:left;font:inherit;color:inherit;
        background:var(--bench);border:1px solid var(--rule);border-radius:3px;
        overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;
        padding:0;color:inherit}
  .card:hover{border-color:var(--rule-lit)}
  .card.archived{opacity:.55}
  .card.archived:hover{opacity:1}
  .card .shot{aspect-ratio:1;background:
      repeating-conic-gradient(#232323 0% 25%,#1c1c1c 0% 50%) 50%/18px 18px;
      display:grid;place-items:center;overflow:hidden}
  .card .shot img{width:100%;height:100%;object-fit:cover}
  .card .shot span{color:var(--ink-faint);font-size:11px}
  .card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
  .card b{font-weight:600;font-size:13px;line-height:1.3}
  .card .sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint)}
  .card .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
  .tagpill{font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;
           border-radius:99px;border:1px solid currentColor}
  .tagpill.shipping{color:var(--chalk)} .tagpill.review{color:var(--amber)}
  .tagpill.failed{color:var(--red)} .tagpill.ready,.tagpill.empty{color:var(--ink-faint)}
  .tagpill.cancelled{color:var(--ink-dim)}
  .tagpill.running,.tagpill.optimising{color:var(--amber)}
  .v-good{color:var(--chalk)} .v-acceptable{color:var(--amber)} .v-reject{color:var(--red)}
  .empty{display:grid;place-items:center;height:100%;text-align:center;padding:40px}
  .empty h2{font-weight:600;font-size:15px;margin-bottom:8px}
  .empty p{color:var(--ink-faint);font-size:13px;max-width:380px}

  /* ── phone + tablet ──────────────────────────────────────
     Capture happens on a phone, so the bench has to work on one. Below 900px the
     specimen list becomes an off-canvas drawer and the two comparison panels stack:
     plate first (you are choosing frames), result under it (you are judging one). */
  .drawer-btn{display:none;padding:8px 12px;font-size:16px;line-height:1}
  .scrim{display:none}

  @media (max-width:900px){
    main{grid-template-columns:1fr}
    .drawer-btn{display:block}
    aside{position:fixed;inset:54px auto 0 0;width:262px;max-width:84vw;z-index:30;
          transform:translateX(-102%);transition:transform .22s ease;
          box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
    body.drawer-open aside{transform:translateX(0)}
    .scrim{display:block;position:fixed;inset:54px 0 0 0;background:#000;opacity:0;
           pointer-events:none;transition:opacity .22s ease;z-index:29}
    body.drawer-open .scrim{opacity:.55;pointer-events:auto}
    .compare{grid-template-columns:1fr;overflow:visible}
    .plate{max-width:520px}
    .stage{min-height:290px}
    #status{max-width:150px}
  }

  /* ── phones ──────────────────────────────────────────────────────
     Measured at 390x780 before this existed: the header wrapped to five rows and took
     228px - 29% of the screen - and four controls were under the 44px that a finger
     can reliably hit. The fix is not smaller text, it is fewer things in the header.

     One row that scrolls sideways, the three views moved to a bottom bar, and the two
     controls that only duplicate something else (Rail, which the drawer already does)
     hidden outright. */
  .tabbar{display:none}
  @media (max-width:760px){
    /* THE PAGE SCROLLS. On a desktop this is an app shell - body clipped, each pane
       scrolling inside its own box - and on a phone that leaves nowhere to scroll at
       all: the bench clips, the body cannot move, and the content below the fold is
       simply unreachable. Every one of those boxes is unlocked here and the document
       becomes the scroller, which is what a phone expects anyway. */
    html,body{height:auto;overflow:visible}
    main{height:auto;min-height:0;display:block}
    .bench{overflow:visible;display:block}
    .compare{overflow:visible;display:block}
    .panel{min-height:0}
    #library,#photos{height:auto;overflow:visible}
    /* The header holds Run engine, so it stays put rather than scrolling away. */
    header{position:sticky;top:0;z-index:20}

    header{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
           -webkit-overflow-scrolling:touch;scrollbar-width:none;
           padding-right:12px;gap:6px}
    header::-webkit-scrollbar{display:none}
    /* Nothing in a scrolling toolbar may shrink, or everything becomes unreadable
       rather than one thing becoming reachable. */
    header > *{flex:0 0 auto}
    header .sp{display:none}       /* a stretching spacer has no job in a scrolling row */
    /* In a row that scrolls, ORDER decides what is reachable without swiping. The
       working controls come first; the ones used once a day scroll off to the right. */
    #menu{order:-6} .wordmark{order:-5} #variant{order:-4}
    #run{order:-3} #regen{order:-3} #cancel{order:-3} #enginewarn{order:-2}
    #engine{order:-1}
    #newvariant{order:5} #rename{order:6} #export{order:7} #credits{order:8}
    #queue{order:9}
    header button,header select{min-height:44px}
    #railtoggle,#view-bench,#view-lib,#view-photos{display:none}
    .wordmark{font-size:12px;letter-spacing:.14em}
    #status{display:none}          /* the same words are already under the plate */

    .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;
            background:var(--bench);border-top:1px solid var(--rule)}
    .tabbar button{flex:1;height:56px;border:0;border-radius:0;background:transparent;
                   color:var(--ink-dim);font:500 11px/1 'Archivo',sans-serif;
                   letter-spacing:.09em;text-transform:uppercase}
    .tabbar button[aria-pressed="true"]{color:var(--chalk);
                                        box-shadow:inset 0 2px 0 var(--chalk)}
    /* Room for the bar, plus the iOS home indicator. */
    main,#library,#photos{padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
    aside{inset:54px auto calc(56px + env(safe-area-inset-bottom,0px)) 0}

    /* Touch has no hover, so a control that appears on hover is invisible on a phone. */
    .cardacts{opacity:1}
    .iconbtn{height:30px;min-width:30px;font-size:11px}
    .fault,.mark{min-height:40px}
    .libgrid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
    /* Two per row, explicitly. Left to flex-wrap the cards landed one per row and
       wasted half the width of a screen that has none to spare. */
    .phshots{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .shotcard{width:auto}
    .shotcard img{width:100%;height:auto;aspect-ratio:1}
  }

  /* Under ~480px the brand is costing 104px of a row that has real work in it, and the
     app is already identified by the drawer and the tab bar. */
  @media (max-width:480px){ .wordmark{display:none} }

  @media (max-width:620px){
    :root{--pad:14px}
    /* NOT flex-wrap here. This block is narrower than the 760px one but comes after it,
       so anything it re-declares wins - which is exactly how the header went on wrapping
       to five rows after being told not to. Header layout lives in the 760px block. */
    main{height:auto;min-height:calc(100% - 54px)}
    aside{inset:54px auto calc(56px + env(safe-area-inset-bottom,0px)) 0;padding-top:12px}
    .scrim{inset:54px 0 0 0}
    .bench{grid-template-rows:auto auto}
    .compare{padding:var(--pad);gap:16px}
    .rail{grid-template-columns:1fr;gap:6px 0;padding:14px var(--pad) 22px}
    .rail .lbl{padding-top:12px}
    .verdicts{flex-wrap:wrap}
    .verdicts button{flex:1 1 30%;min-height:44px}
    .fault{padding:9px 12px}          /* touch targets */
    button,select,input{min-height:40px}
    #variant,#engine{max-width:150px}
    #newvar{width:100%;order:10}
    .slot .lb{font-size:10px;padding:4px 6px}
    .cell.predicted::after{content:'PREDICTED';position:absolute;left:6px;bottom:6px;
      font:500 9px/1 'Archivo',sans-serif;letter-spacing:.08em;color:var(--amber);
      background:rgba(0,0,0,.65);padding:3px 5px;border-radius:2px;pointer-events:none}
  }

  /* the plate is square by design; keep it that way but never let it overflow */
  .plate{width:100%;max-width:min(100%,640px)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header>
  <button id="menu" class="drawer-btn" aria-label="Show dishes" aria-expanded="false">☰</button>
  <button id="railtoggle" class="viewtab" title="Show or hide the dish rail" aria-pressed="true">Rail</button>
  <span class="wordmark">Scan<span>·</span>Studio</span>
  <button id="view-bench" class="viewtab" aria-pressed="true">Bench</button>
  <button id="view-lib" class="viewtab" aria-pressed="false">Models</button>
  <button id="view-photos" class="viewtab" aria-pressed="false">Photos</button>
  <select id="variant" title="Angle strategy"></select>
  <button id="newvariant">New variant</button>
  <button id="rename" title="Rename this dish">Rename</button>
  <span class="sp"></span>
  <span id="status"></span>
  <span id="credits" class="mono" title="Meshy credits left on the account"></span>
  <span id="queue" class="mono" hidden></span>
  <select id="engine"></select>
  <button id="run" class="run">Run engine</button>
  <button id="regen" class="ghost" hidden title="Replace the existing model. The current one cannot be recovered.">Regenerate</button>
  <button id="cancel" hidden>Cancel</button>
  <span id="enginewarn" class="warnpill" hidden></span>

<input type="file" id="picker" accept="image/*" multiple hidden>

<script>
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const enc = encodeURIComponent;

let META = {}, LIST = [], CUR = null, DISH = null, VAR = 'default', PICK_SLOT = 0, POLL = null;
/* 'ship' or 'master'. Sticky across dishes on purpose: someone auditing whether the
   optimiser is eating garnish wants to stay on one side of the comparison. */
let STAGE = 'ship';
/* Storage keys every dish by a slug; the rail is a list of slugs; DISH held whatever a
   person typed. So `d.dish === DISH` was false for every renamed or newly created dish
   and NOTHING ever showed as selected - which is what made the rail feel deceptive.
   This mirrors dataset.slug so the two sides can be compared. */
const slug = t => (t || '').toLowerCase().replace(/[^a-z0-9]+/g, '-')
  .replace(/^-+|-+$/g, '') || 'untitled';
/* Anything past this is not previewed without being asked for. 25 MB is well above a
   shipping file (3-6 MB) and well below a raw master (70 MB), so it never gets in the
   way of the thing people actually look at. */
const MASTER_AUTOLOAD_BYTES = 25 * 1024 * 1024;
let FORCE_MASTER = false;

const api = (u, body) => fetch(u, body ? {
  method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
} : undefined).then(r => r.json());

/* What gets STORED, which is not the same question as what gets SENT.
   The photos bucket is the training corpus - the moat - and a dish cannot be reshot six
   months later, so keep well more detail here than any engine consumes today. 4096px at
   q0.95 lands around 3-4MB: cheap on R2, still plenty for a future fine-tune, and small
   enough that a phone can upload it. The engine gets its own, smaller cap server-side. */
const STORE_MAX_EDGE = 4096;
function prepare(file, max = STORE_MAX_EDGE) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.95));
    };
    img.onerror = () => reject(new Error(`${file.name} is not a readable image`));
    img.src = URL.createObjectURL(file);
  });
}

const say = t => $('#status').textContent = t;

async function boot() {
  META = await api('/api/meta');
  paintCredits();
  paintQueue();
  setInterval(pollQueue, 60000);
  document.addEventListener('visibilitychange', pollQueue);
  paintEngineWarning();
  /* "meshy-7 · 30cr" said nothing about what distinguishes the entries. The only real
     difference between them is texture resolution, so that is what the label shows. */
  $('#engine').innerHTML = META.engines.map(e =>
    `<option value="${e.name}"${e.name === META.default_engine ? ' selected' : ''}>${e.name} · ${e.texture || '4k'} · ${e.credits}cr</option>`).join('');
  await refresh();
  LIST.length ? open(LIST[0].dish, LIST[0].variants[0]) : renderEmpty();
}

/* Credits, in dishes rather than in credits. "1,580" means nothing to someone deciding
   whether to scan another plate; "52 dishes" does. */
/* The engine picker can now name a choice this host cannot finish. Saying so costs
   nothing; finding out afterwards costs 30 credits and leaves an archived master with no
   shipping files. */
function paintEngineWarning() {
  const sel = $('#engine'), note = $('#enginewarn');
  if (!sel || !note) return;
  const e = (META.engines || []).find(x => x.name === sel.value);
  const why = e && e.cannot_optimise;
  note.textContent = why || '';
  note.hidden = !why;
  const run = $('#run');
  if (run) run.classList.toggle('risky', !!why);
}

/* Queue depth, and dead letters loudly. A generation that died is 30 credits already
   spent with nothing to show for it - the one thing in this system that must never be
   quiet - and before the queue existed it was invisible: the work simply stopped and the
   record went on saying it was running. */
function paintQueue() {
  const el = $('#queue'), j = META.jobs;
  if (!el || !j) return;
  const busy = (j.queued || 0) + (j.running || 0);
  el.hidden = !busy && !j.dead;
  el.className = 'mono' + (j.dead ? ' dead' : busy ? ' busy' : '');
  el.textContent = (busy ? `${busy} in queue` : '')
    + (j.dead ? `${busy ? ' · ' : ''}${j.dead} failed` : '');
  el.title = j.dead
    ? (j.dead_jobs || []).map(d => `${d.dish} / ${d.variant} (${d.kind}): ${d.error}`)
        .join('\n') || 'Jobs that gave up. Nothing will retry them.'
    : `${j.queued} waiting, ${j.running} running `
      + `(${j.generating} generating, ${j.optimising} optimising). `
      + `Meshy allows ${j.meshy_ceiling} at once.`;
}

/* Every refresh is three R2 listings - a metered operation - so this runs on a slow
   clock and only while somebody is looking at the tab. */
async function pollQueue() {
  if (document.visibilityState !== 'visible') return;
  try { META.jobs = (await api('/api/meta')).jobs; paintQueue(); }
  catch (e) { /* a failed poll is not worth an error in the header */ }
}

function paintCredits() {
  const el = $('#credits');
  if (!el) return;
  const c = META.credits;
  if (c === null || c === undefined) { el.textContent = ''; return; }
  const per = Math.max(1, Math.min(...(META.engines || [{credits: 30}])
    .map(e => e.credits || 30)));
  const dishes = Math.floor(c / per);
  el.textContent = `${c.toLocaleString()} cr · ~${dishes} dishes`;
  el.className = 'mono' + (c < per ? ' out' : c < per * 5 ? ' low' : '');
  el.title = `${c} Meshy credits left, about ${dishes} more generations at ${per} each`;
}

async function refresh() {
  LIST = (await api('/api/dishes')).dishes;
  $('#specimens').innerHTML = LIST.map(d => `
    <button class="spec" data-dish="${d.dish}" aria-current="${slug(d.dish) === slug(DISH)}">
      <b>${d.title || d.dish}</b>
      <small>${d.empty ? 'empty — add a photo'
        : `${d.variants.length} variant${d.variants.length === 1 ? '' : 's'}`
          + `${d.judged ? ` · ${d.judged} judged` : ''}`
          + `${d.shipping ? ` · ${d.shipping} shipping` : ''}`}</small>
    </button>`).join('');
}

function renderEmpty() {
  $('#bench').innerHTML = `<div class="empty"><div>
    <h2>No dishes yet</h2>
    <p>Make a dish, drop four photos into the plate, and run an engine.
       Nothing is read from your drive &mdash; only what you upload here.</p>
  </div></div>`;
  say('');
}

async function open(dish, variant) {
  DISH = dish; VAR = variant || 'default';
  CUR = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`);
  paint(); refresh();
}

/* A blank 3D panel used to mean anything at all: a model that had not downloaded, a
   decoder that had not arrived, a file the browser refused. Now it says which.

   Worth knowing what a Draco model actually needs: model-viewer fetches the Draco
   decoder from www.gstatic.com the first time it meets one. That is a second network
   dependency beyond our own server, it is not obvious from anywhere in the UI, and if
   it fails the model silently never appears. If this ever starts reporting decode
   failures on a good connection, that is the thing to suspect. */
function watchViewer(mv, src) {
  if (!mv) return;
  const badge = $('#mvstate');
  const show = (text, cls) => {
    if (!badge) return;
    badge.className = 'mvstate' + (cls ? ' ' + cls : '');
    badge.innerHTML = cls === 'busy'
      ? `<div class="spinner"></div><span>${text}</span>` : `<span>${text}</span>`;
    badge.hidden = !text;
  };
  show('loading', 'busy');
  mv.addEventListener('progress', e => {
    const pct = Math.round((e.detail.totalProgress || 0) * 100);
    if (pct < 100) show(`loading ${pct}%`, 'busy');
  });
  mv.addEventListener('load', () => show(''));
  mv.addEventListener('error', async e => {
    const kind = (e.detail && e.detail.type) || 'unknown';
    /* Ask the server ourselves, so the message separates "the file is not there" from
       "the browser would not accept it" - two very different problems that look the
       same from inside model-viewer. */
    let reachable = '';
    try {
      const r = await fetch(src, {method: 'GET'});
      reachable = r.ok ? `the file downloads fine (${r.status})` : `server said ${r.status}`;
    } catch (err) { reachable = 'the browser blocked the download'; }
    show(`could not display this model — ${kind}; ${reachable}`, 'bad');
  });
  /* A model that never fires load or error at all is its own symptom. */
  setTimeout(() => {
    if (!mv.loaded && badge && !badge.hidden && !badge.classList.contains('bad')) {
      show('still loading — large file, or the Draco decoder has not arrived', 'busy');
    }
  }, 20000);
}

/* How long the current optimise has been going. The server stamps `optimising_since`
   when it starts; a run that outlives its worker is only visible this way. */
const seconds = d => d.optimising_since
  ? Math.max(0, (Date.now() - Date.parse(d.optimising_since)) / 1000) : 0;
const elapsed = d => {
  const s = Math.round(seconds(d));
  if (!d.optimising_since) return '';
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s`;
};

function paint() {
  if (!$('#plate')) $('#bench').replaceChildren($('#tpl-bench').content.cloneNode(true));
  const d = CUR;

  const vs = [...new Set([...(d.all_variants || []), VAR])];
  $('#variant').innerHTML = vs.map(v => `<option${v === VAR ? ' selected' : ''}>${v}</option>`).join('');

  $('#plate').innerHTML = META.slots.map((name, i) => {
    const f = d.frames[i];
    const primary = i === 0 ? ' primary' : '';
    /* A predicted frame is labelled on the bench as well as in the photo shelf. Judging
       a model without knowing which of its inputs were photographs is judging blind. */
    const pred = f && f.generated ? ' predicted' : '';
    return `<div class="cell${primary}${pred}" data-slot="${i}">
      <span class="no mono">0${i + 1}</span>
      ${f ? `<img src="/frame?dish=${enc(DISH)}&variant=${enc(VAR)}&slot=${i}&v=${Date.now()}" alt="${name}">
             <button class="x" data-clear="${i}" title="Remove">Clear</button>` : ''}
      ${f ? '' : '<span class="drop">drop photo</span>'}
      <span class="role">${name}${i === 0 ? ' · primary' : ''}</span>
    </div>`;
  }).join('');

  $('#filled').textContent = `${d.filled} of 4`;
  $('#platehint').textContent = d.filled === 0 ? 'need at least one'
    : d.filled < 4 ? `${d.filled} of 4 — more frames, better model` : 'ready';

  const stage = $('#stage');
  if (d.status === 'running') {
    stage.innerHTML = `<div class="stagemsg"><div class="spinner"></div>
      <span class="lbl">Generating</span><p>Usually one to three minutes.</p></div>`;
    POLL ||= setInterval(async () => {
      const f = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`);
      if (f.status !== 'running') { clearInterval(POLL); POLL = null; CUR = f; paint(); refresh(); }
    }, 4000);
  /* `catalogued` and `exporting` are the old names for this state. Records written
     before the rename still carry them, and a record is not worth a migration.

     `optimising` is in here too, and that is the point: once generation has produced a
     master there is a model to look at, and making someone watch a spinner while a
     finished file sits in storage is just hiding it. The optimiser catches up in the
     background and the panel swaps to the shipping file when it lands. */
  } else if (['review', 'catalogued', 'exporting', 'optimising'].includes(d.status)
             && d.model_key) {
    // You judge what SHIPS, not the master. A master can look perfect while the optimiser
    // has quietly eaten the garnish, and at ~216 MB of VRAM against ~52 MB it is also not
    // the thing a guest's phone has to survive. The Master tab is there to tell the two
    // apart when a verdict is contested.
    const busy = d.status === 'optimising';
    const shippable = !!(d.catalog_keys && Object.keys(d.catalog_keys).length);
    /* While the optimiser runs, the master is the only file guaranteed to match this
       generation - the catalogue, if any, is from the previous pass. */
    const stg = (shippable && !busy) ? STAGE : 'master';
    const src = `/model?dish=${enc(DISH)}&variant=${enc(VAR)}&stage=${stg}&v=${d.catalogued_utc || d.seconds}`;
    /* A raw Meshy master is ~70 MB and 1.9M triangles - roughly 216 MB of VRAM before
       anything is drawn. Handing that to a browser does not fail, it stalls, and the
       panel looks broken while the tab slowly dies. So the Master tab states what the
       file is and offers it deliberately, rather than loading it because someone
       clicked a tab. The shipping file has no such problem and always loads. */
    /* Records made before master_bytes existed still carry the numbers in the
       optimiser's stats, so fall back rather than treating an old dish as small. */
    const st0 = d.export_stats || {};
    const mbytes = d.master_bytes || st0.master_bytes || 0;
    const mtris = d.master_triangles || st0.source_triangles || 0;
    const heavy = stg === 'master' && mbytes > MASTER_AUTOLOAD_BYTES;
    if (heavy && !FORCE_MASTER) {
      const mb = (mbytes / 1048576).toFixed(1);
      const tris = mtris.toLocaleString();
      stage.innerHTML = `<div class="stagemsg"><span class="lbl">Master preview disabled</span>
        <p>${mb} MB, ${tris} triangles. Loading it here would use roughly
        ${Math.round(mtris / 9000)} MB of video memory and stall this tab.
        It is stored safely in R2 and is what every optimised file is built from.</p>
        <p><button id="forcemaster">Load it anyway</button></p></div>`;
      $('#stagetabs').hidden = false;
      $$('#stagetabs .minitab').forEach(b =>
        b.setAttribute('aria-pressed', String(b.dataset.stage === stg)));
      $('#resultmeta').textContent = `master · ${d.engine} · ${d.seconds}s`;
      paintScale(d);
      return paintRail(d);
    }
    stage.innerHTML = `<model-viewer src="${src}"
      camera-controls auto-rotate rotation-per-second="18deg" shadow-intensity="1"
      exposure="1.1" interaction-prompt="none" alt="Generated model of ${DISH}"></model-viewer>
      <div class="mvstate" id="mvstate"><div class="spinner"></div><span>loading</span></div>`;
    watchViewer(stage.querySelector('model-viewer'), src);
    const tabs = $('#stagetabs');
    tabs.hidden = !shippable || busy;
    $$('#stagetabs .minitab').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.stage === stg)));
    const st = d.export_stats || {};
    const dims = (st.size_after || []).map(v => (v * 100).toFixed(1)).join(' x ');
    $('#resultmeta').textContent = busy
      ? `master · optimising: ${d.stage || 'starting'}${elapsed(d) ? ' · ' + elapsed(d) : ''}`
      : stg === 'master'
        ? `master · ${d.engine} · ${d.seconds}s`
        : `${(st.draco_bytes/1048576||0).toFixed(2)} MB draco · ${st.result_triangles||'?'} tris${dims ? ` · ${dims} cm` : ''}`;
    /* A dish with a master and no shipping file looked identical to a finished one
       except that the Shipping tab did nothing. Silence is the worst possible answer
       here, because the fix is usually one sentence away. */
    if (!shippable && !busy) {
      const why = d.export_error
        || 'The optimiser has not run on this dish yet. Press Re-optimise, or run '
           + 'worker.py on a machine with more memory if this host refused it.';
      stage.insertAdjacentHTML('beforeend',
        `<div class="mvstate bad" style="bottom:auto;top:10px">No shipping file yet — ${why}</div>`);
    }
    if (busy) {
      POLL ||= setInterval(async () => {
        const f = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`);
        CUR = f;
        if (f.status !== 'optimising') { clearInterval(POLL); POLL = null; refresh(); }
        paint();
      }, 3000);
    }
  } else if (d.status === 'optimising') {
    stage.innerHTML = `<div class="stagemsg"><div class="spinner"></div>
      <span class="lbl">Optimising</span><p>${d.stage || 'starting'}</p></div>`;
    $('#stagetabs').hidden = true;
    $('#resultmeta').textContent = elapsed(d);
    POLL ||= setInterval(async () => {
      const f = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`);
      CUR = f;
      if (f.status !== 'optimising') { clearInterval(POLL); POLL = null; refresh(); }
      paint();
    }, 3000);
  } else if (d.status === 'cancelled') {
    stage.innerHTML = `<div class="stagemsg"><span class="lbl">Cancelled</span>
      <p>${d.error || 'Stopped before it finished.'}</p>
      <p>The photos are still here. Press Run engine to try again.</p></div>`;
    $('#resultmeta').textContent = '';
    $('#stagetabs').hidden = true;
  } else if (d.status === 'failed') {
    stage.innerHTML = `<div class="stagemsg"><span class="lbl">Failed</span>
      <p class="err">${d.error || 'no detail returned'}</p></div>`;
    $('#resultmeta').textContent = d.engine || '';
    $('#stagetabs').hidden = true;
  } else {
    stage.innerHTML = `<div class="stagemsg"><span class="lbl">Nothing generated</span>
      <p>${d.filled === 0 ? 'Add at least one frame.' : 'Press Run engine.'}</p></div>`;
    $('#resultmeta').textContent = '';
    $('#stagetabs').hidden = true;
  }
  paintScale(d);
  paintOptimiser(d);
  paintRail(d);
}

function paintRail(d) {
  $('#faults').innerHTML = META.faults.map(f =>
    `<button class="fault" data-f="${f}" aria-pressed="${(d.faults || []).includes(f)}">${f}</button>`).join('');
  $$('.mark').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === d.verdict));
  $('#note').value = d.note || '';
  /* Run engine is off once a model exists. Generating again overwrites it, and that
     has already cost one good model and 30 credits. Regenerate is the deliberate way. */
  const hasModel = !!d.model_key;
  /* Offered only where it helps: exactly one photo, and no model yet. With two or more
     real photographs a prediction is strictly worse than what is already there. */
  const mv = $('#multiview'), mvnote = $('#mvnote');
  if (mv) {
    const offer = d.filled === 1 && !hasModel && d.status !== 'running';
    mv.hidden = !offer;
    if (mvnote) {
      mvnote.className = 'hintline';
      mvnote.textContent = offer
        ? 'One photo. Three more angles can be predicted from it — or shoot them, which is better.'
        : '';
    }
  }
  $('#run').disabled = d.status === 'running' || d.filled < 1 || hasModel;
  $('#run').title = hasModel
    ? 'This dish already has a model. Use Regenerate to replace it.' : '';
  const regen = $('#regen');
  if (regen) {
    regen.hidden = !hasModel;
    regen.disabled = d.status === 'running' || d.filled < 1;
  }
  const busyNow = ['running', 'optimising'].includes(d.status);
  const cancelBtn = $('#cancel');
  if (cancelBtn) {
    cancelBtn.hidden = !busyNow;
    cancelBtn.textContent = d.status === 'running' ? 'Cancel generation' : 'Cancel';
  }

  /* Optimisation now runs itself after generation and after any size change, so this
     button is the retry and the manual re-run, not the thing that makes the catalogue. */
  const btn = $('#export-model'), note = $('#exportnote');
  if (btn) {
    const shippable = !!(d.catalog_keys && Object.keys(d.catalog_keys).length);
    const shippable0 = !!(d.catalog_keys && Object.keys(d.catalog_keys).length);
    ['#download-files', '#download-all'].forEach(sel => {
      const b = $(sel);
      if (b) b.disabled = !shippable0 && !(sel === '#download-all' && d.model_key);
    });
    const stuck = d.status === 'optimising' && seconds(d) > 180;
    btn.disabled = !d.model_key || d.status === 'running' ||
                   (d.status === 'optimising' && !stuck);
    btn.textContent = stuck ? 'Restart optimise' : 'Re-optimise';
    note.className = 'hintline';
    if (stuck) {
      note.textContent = `Stalled at "${d.stage || 'starting'}" for ${elapsed(d)}. ` +
        `The worker is gone — press Restart optimise.`;
      note.classList.add('warn');
    }
    else if (d.export_error) { note.textContent = d.export_error; note.classList.add('warn'); }
    else if (shippable) {
      const st = d.export_stats || {};
      note.textContent = `${(st.draco_bytes/1048576||0).toFixed(2)} MB shipping, ${st.shrink||'?'}x smaller than the master`;
      note.classList.add('ok');
    }
    else if (!d.model_key) note.textContent = '';
    else note.textContent = META.optimizer && META.optimizer !== 'none (masters kept, export unavailable)'
      ? `Toolchain: ${META.optimizer}` : 'No optimiser on this host — the master is kept regardless.';
  }
  say(`${d.title || DISH} / ${VAR} · ${d.status}`);
}

/* Real-world size. One dimension is enough - the model supplies the aspect ratio for
   the other two - so the question is which one the person happens to know. The shape
   picker only PROPOSES a number; every figure behind it is a guess (dataset.SHAPES) that
   ~30 real dishes are meant to replace. */
/* Targets for the SHIPPED file, not for generation. Texture stops at 2048 deliberately:
   an 8192px map costs ~256 MB of video memory on a phone before anything is drawn, so
   4k and 8k belong in the engine picker where they give the downscaler a better source,
   never in the file a diner downloads. */
function paintOptimiser(d) {
  const tri = $('#opttri'), tex = $('#opttex'), custom = $('#opttricustom'), note = $('#optnote');
  if (!tri) return;
  const o = d.optimise || {};
  const st = d.export_stats || {};
  if (!tri.options.length) {
    tri.innerHTML = (META.triangle_targets || [0, 20000, 40000, 80000])
      .map(n => n === 0
        ? '<option value="-1">Auto — as few as it can</option>'
        : `<option value="${n}">${(n / 1000)}k triangles</option>`).join('')
      + '<option value="0">custom…</option>';
    tex.innerHTML = (META.texture_targets || [1024, 2048])
      .map(n => `<option value="${n}">${n}px textures${n > 2048 ? ' — testing only' : ''}</option>`).join('');
  }
  const isAuto = o.triangles === -1 || (!o.triangles && st.auto_triangles);
  const currentTri = isAuto ? -1 : (o.triangles || st.target_triangles || 40000);
  const known = isAuto || [...tri.options].some(x => +x.value === currentTri);
  tri.value = String(isAuto ? -1 : (known ? currentTri : 0));
  custom.hidden = known;
  custom.value = known ? '' : currentTri;
  tex.value = String(o.texture || st.target_texture || 2048);

  note.className = 'hintline';
  const got = st.result_triangles;
  if (!got) { note.textContent = ''; return; }
  if (st.auto_triangles) {
    note.textContent = `${got.toLocaleString()} triangles — chosen by the simplifier`;
  } else {
    const asked = st.target_triangles || currentTri;
    // meshopt stops early rather than break the surface, so asked and got often differ.
    if (got > asked * 1.15) {
      note.textContent = `asked ${asked.toLocaleString()}, got ${got.toLocaleString()} — it could not cut further`;
      note.classList.add('warn');
    } else note.textContent = `${got.toLocaleString()} triangles`;
  }
}

function paintScale(d) {
  const shape = $('#shape'), axis = $('#scaleaxis'), cm = $('#scalecm'), note = $('#scalenote');
  if (!shape) return;
  const sc = d.scale || {};
  if (!shape.options.length) {
    shape.innerHTML = '<option value="">Shape…</option>' +
      (META.shapes || []).map(s => `<option value="${s.id}">${s.label} · ${s.cm}cm</option>`).join('');
    axis.innerHTML = (META.scale_axes || []).map(a =>
      `<option value="${a}">${a === 'width' ? 'width / across' : a}</option>`).join('');
  }
  shape.value = sc.shape || '';
  axis.value = sc.axis || 'width';
  cm.value = sc.cm || '';
  cm.classList.toggle('unset', !sc.cm);

  note.className = 'hintline';
  const st = d.export_stats || {};
  const dims = (st.size_after || []).map(v => (v * 100).toFixed(1));
  /* The stats carry the size the SHIPPING file was actually built at. Compare it with
     what the record now says, or a number typed a second ago reads as already applied. */
  const applied = st.scale_cm === sc.cm && st.scale_axis === sc.axis;
  if (!sc.cm) {
    note.textContent = dims.length
      ? `Not set — shipping at ${dims.join(' x ')} cm, whatever the engine invented.`
      : 'Not set — this ships at whatever size the engine invented.';
    note.classList.add('warn');
  } else if (applied && dims.length) {
    note.textContent = `${dims.join(' x ')} cm on the table`;
    note.classList.add('ok');
  } else {
    note.textContent = `${sc.cm} cm ${sc.axis} — applied on the next optimise`;
  }
}

const saveVerdict = () => api('/api/verdict',
  {dish: DISH, variant: VAR, verdict: CUR.verdict, faults: CUR.faults, note: $('#note').value});

async function upload(files, startSlot) {
  let slot = startSlot;
  for (const file of files) {
    if (slot > 3) { say('Plate is full — clear a cell to replace one'); break; }
    if (!file.type.startsWith('image/')) continue;
    say(`Preparing ${file.name}…`);
    try {
      CUR = await api('/api/upload',
        {dish: DISH, variant: VAR, slot, name: file.name, data: await prepare(file)});
      slot++;
    } catch (e) { say(e.message); }
  }
  paint(); refresh();
}

$('#run').onclick = async () => {
  /* Ask before spending. Meshy refunds a cancelled task only while it is still queued -
     nothing once processing starts - so the cheapest cancel is the one that happens
     before the request is sent. */
  const eng = (META.engines || []).find(e => e.name === $('#engine').value) || {};
  const cost = eng.credits || 30;
  const left = META.credits;
  const after = (left === null || left === undefined) ? null : left - cost;
  const lines = [`Generate "${(CUR && CUR.title) || DISH}" / ${VAR}?`, '',
    `This spends ${cost} credits.`];
  if (after !== null) lines.push(`${left.toLocaleString()} left now, ${after.toLocaleString()} after — about ${Math.floor(after / cost)} more dishes.`);
  if (CUR && CUR.filled < 4) lines.push('', `Only ${CUR.filled} of 4 photos. More photos, better model.`);
  if (eng.cannot_optimise) lines.push('', eng.cannot_optimise);
  if (!confirm(lines.join('\n'))) return;

  /* Paint first, await second. Jobs now run inside the request that starts them, so the
     response does not arrive until the work is finished - three minutes for a
     generation. Awaiting first would leave the panel blank for all of it. The record is
     what the poll reads, so progress shows either way. */
  CUR.status = 'running'; paint();
  const r = await api('/api/generate', {dish: DISH, variant: VAR, engine: $('#engine').value});
  if (r && r.error) { say(r.error); }
  CUR = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`);
  paint(); refresh();
};

document.addEventListener('click', async e => {

    await api('/api/archive', {dish: arch.dataset.d, variant: arch.dataset.v,
                               archived: arch.dataset.arch === '1'});
    return loadLibrary();
  }
  const del = e.target.closest('[data-del]');
  if (del) {
    e.stopPropagation();
    if (!confirm(`Delete "${del.dataset.d}" / ${del.dataset.v} permanently?\n\n`
      + 'The photos, the master and the shipping files all go. This cannot be undone.\n'
      + 'Archive hides it instead, and keeps the evidence.')) return;
    await api('/api/delete', {dish: del.dataset.d, only_variant: del.dataset.v});
    return loadLibrary();
  }
  const tab = e.target.closest('#stagetabs .minitab');
  if (tab) { STAGE = tab.dataset.stage; FORCE_MASTER = false; return paint(); }
  if (e.target.id === 'forcemaster') { FORCE_MASTER = true; return paint(); }
  /* Delegated for a second reason: #export-model lives inside <template id="tpl-bench">,

     line after it - boot() included - down with it. The page loaded and did nothing. */
  if (e.target.id === 'download-files' || e.target.id === 'download-all') {
    /* A plain link rather than fetch-then-blob: the file can be 70 MB with the master
       included, and the browser's own download handles that without our holding it
       in memory first. */
    const master = e.target.id === 'download-all' ? '&master=1' : '';
    location.href = `/download?dish=${enc(DISH)}&variant=${enc(VAR)}${master}`;
    return;
  }
  if (e.target.id === 'multiview') {
  if (!confirm('Predict three more angles from this photo?\n\n'
    + 'They are generated, not photographed — the engine invents the back of the dish. '
    + 'That usually makes a more consistent model, but nothing new about the real dish '
    + 'is added, and four real photos beat this every time.\n\nThis spends credits.')) return;

    CUR = r;
    META.credits = (META.credits === null || META.credits === undefined || !r.spent)
      ? META.credits : META.credits - r.spent;
    paintCredits();
    paint(); refresh();
    say(`Predicted ${r.generated} view${r.generated === 1 ? '' : 's'}`
        + (r.spent ? ` · ${r.spent} credits` : ''));
  } finally {
    btn.disabled = false;
  }
  }
  if (e.target.id === 'export-model') {
    CUR.status = 'optimising'; CUR.stage = 'queued'; paint();
    const r = await api('/api/optimize', {dish: DISH, variant: VAR});
    if (r && r.error) say(r.error);
    CUR = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`);
    paint(); refresh();
  }
});

/* Export sends CSV, and `api()` parses every response as JSON - so this threw on the
   first character and the button silently did nothing. It also never downloaded
   anything: it read a `.csv` field that the endpoint has never returned. */
$('#export').onclick = async () => {
  const btn = $('#export');
  btn.disabled = true;
  try {
    const r = await fetch('/api/export');
    if (!r.ok) return say(`Export failed (${r.status})`);
    const text = await r.text();
    const rows = text.trim().split('\n').length - 1;   // minus the header
    const url = URL.createObjectURL(new Blob([text], {type: 'text/csv;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url;
    a.download = `betareal-dishes-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    say(`Exported ${rows} row${rows === 1 ? '' : 's'}`);
  } catch (e) {
    say('Export failed: ' + e.message);
  } finally {
    btn.disabled = false;
  }
};

/* Photographs and generated views, on their own shelf. They are the input side of the
   pipeline: what a model is only ever as good as, and the one thing here that cannot be
   remade for 30 credits if it is lost. Predicted frames are marked, because at review
   time it has to be obvious which parts of a model came from a camera. */
let PHOTOS = [];

async function loadPhotos() {
  PHOTOS = (await api('/api/photos')).items;
  const total = PHOTOS.reduce((n, r) => n + r.shots.length, 0);
  const predicted = PHOTOS.reduce((n, r) => n + r.predicted, 0);
  $('#photocount').textContent =
    `${total} photo${total === 1 ? '' : 's'} across ${PHOTOS.length} dish${PHOTOS.length === 1 ? '' : 'es'}`
    + (predicted ? ` · ${predicted} predicted` : '');
  $('#photogrid').innerHTML = PHOTOS.length ? PHOTOS.map(r => `
    <div class="phrow${r.archived ? ' archived' : ''}">
      <div class="phhead">
        <b>${r.title || r.dish}</b>
        <span class="sub">${r.variant} · ${r.real} photographed${r.predicted ? ` · ${r.predicted} predicted` : ''}${r.has_model ? ' · has a model' : ''}</span>
      </div>
      <div class="phshots">
        ${r.shots.map(sh => `
          <figure class="shotcard${sh.generated ? ' predicted' : ''}">
            <img loading="lazy" alt="${sh.role}"
                 src="/frame?dish=${enc(r.dish)}&variant=${enc(r.variant)}&slot=${sh.slot}">
            <figcaption>
              <span>${sh.role}</span>
              ${sh.generated ? '<span class="predtag">predicted</span>'
                             : `<span class="sub">${Math.round(sh.bytes / 1024)} KB</span>`}
            </figcaption>
          </figure>`).join('')}
      </div>
    </div>`).join('')
    : '<p class="hintline">No photos yet.</p>';
}

  $$('#tabbar button').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.view === which)));
  if (lib) loadLibrary();
  if (pho) loadPhotos();
}

$('#view-lib').onclick = () => showView('library');
$('#view-photos').onclick = () => showView('photos');
$$('#tabbar button').forEach(b => { b.onclick = () => showView(b.dataset.view); });

/* The rail duplicates the Models view, which is a fair complaint - but it is the only
   way to move between variants of a dish without leaving the bench, which is exactly
   what comparing two angle strategies needs. So it stays, and it folds away.
   The choice is remembered, because a preference you have to re-make is not one. */
function setRail(open) {
  document.body.classList.toggle('norail', !open);
  $('#railtoggle').setAttribute('aria-pressed', String(open));
  try { localStorage.setItem('betareal.rail', open ? '1' : '0'); } catch (e) {}
}
$('#railtoggle').onclick = () =>
  setRail(document.body.classList.contains('norail'));
try { setRail(localStorage.getItem('betareal.rail') !== '0'); } catch (e) {}
$('#view-bench').onclick = () => showView('bench');

document.addEventListener('click', e => {
  const chip = e.target.closest('#libfilters .chip');
  if (chip) {
    LIBFILTER = chip.dataset.f;
    document.querySelectorAll('#libfilters .chip').forEach(c =>
      c.setAttribute('aria-pressed', String(c === chip)));
    return paintLibrary();
  }
  const card = e.target.closest('.card');
  if (card) { showView('bench'); open(card.dataset.d, card.dataset.v); }
});

boot();
</script>
