<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scan Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  /* A colour-judgement instrument. The chrome is true neutral - equal R, G and B at every
     step - so nothing on screen biases how a dish reads. The only saturated colour here
     should be the food. Verdict marks are the exception: grease pencil, and only there. */
  :root{
    --void:#151515; --bench:#1e1e1e; --plate:#262626; --raise:#2f2f2f;
    --rule:#383838; --rule-lit:#4a4a4a;
    --ink:#e4e4e4; --ink-dim:#8c8c8c; --ink-faint:#5f5f5f;
    --chalk:#f0ede7; --amber:#d99a2b; --red:#c4402f;
    --pad:20px;
    --label:600 10px/1 'Archivo',sans-serif;
    --track:.16em;
  }
  *{box-sizing:border-box;margin:0}
  /* Author styles beat the UA sheet's [hidden] rule regardless of specificity, so any
     class carrying its own `display` silently ignores el.hidden. That is how the
     Shipping/Master tabs stayed on screen for dishes with nothing to ship. */
  [hidden]{display:none !important}
  html,body{height:100%}
  body{background:var(--void);color:var(--ink);
       font:400 14px/1.55 'Archivo',system-ui,sans-serif;
       -webkit-font-smoothing:antialiased;overflow:hidden}
  .lbl{font:var(--label);letter-spacing:var(--track);text-transform:uppercase;color:var(--ink-dim)}
  .mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

  button,select,input,textarea{font:inherit;color:var(--ink);background:var(--raise);
    border:1px solid var(--rule);border-radius:2px;padding:7px 12px}
  button{cursor:pointer;transition:background .12s,border-color .12s}
  button:hover:not(:disabled){background:#3a3a3a;border-color:var(--rule-lit)}
  button:disabled{opacity:.35;cursor:not-allowed}
  :focus-visible{outline:2px solid var(--chalk);outline-offset:2px}

  .run{background:var(--chalk);color:#151515;border-color:transparent;font-weight:600;
       letter-spacing:.08em;text-transform:uppercase;font-size:11px;padding:8px 18px}
  .run:hover:not(:disabled){background:#fff}

  /* ── frame ─────────────────────────────────────────────── */
  header{display:flex;align-items:center;gap:10px;height:54px;padding:0 var(--pad);
         border-bottom:1px solid var(--rule);background:var(--bench)}
  .wordmark{font:700 12px/1 'Archivo',sans-serif;letter-spacing:.2em;text-transform:uppercase;
            margin-right:6px}
  .wordmark span{color:var(--ink-faint)}
  .sp{flex:1}
  #status{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-dim);
          max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  main{display:grid;grid-template-columns:216px 1fr;height:calc(100% - 54px)}

  /* ── specimen list ─────────────────────────────────────── */
  aside{border-right:1px solid var(--rule);background:var(--bench);overflow:auto;
        padding:16px 0}
  aside .lbl{padding:0 var(--pad) 10px;display:block}
  .spec{display:block;width:100%;text-align:left;background:none;border:0;border-radius:0;
        padding:8px var(--pad);cursor:pointer}
  .spec:hover{background:var(--plate)}
  .spec[aria-current="true"]{background:var(--plate);box-shadow:inset 2px 0 0 var(--chalk)}
  .spec b{font-weight:500;display:block;font-size:13px}
  .spec small{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--ink-faint)}
  .newdish{margin:12px var(--pad) 0;width:calc(100% - var(--pad)*2);font-size:12px}

  /* ── bench ─────────────────────────────────────────────── */
  .bench{display:grid;grid-template-rows:1fr auto;overflow:hidden}
  .compare{display:grid;grid-template-columns:1fr 1fr;gap:var(--pad);
           padding:var(--pad);overflow:auto;min-height:0}
  .panel{display:flex;flex-direction:column;min-height:0}
  .panel > header{all:unset;display:flex;align-items:baseline;gap:10px;
                  padding-bottom:9px;margin-bottom:11px;border-bottom:1px solid var(--rule)}

  /* The input plate: four frames butted into one object with hairline gutters, because
     Meshy receives them as one ordered array, not four files. */
  .plate{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
         gap:1px;background:var(--rule);border:1px solid var(--rule);
         aspect-ratio:1;min-height:0}
  .cell{position:relative;background:var(--plate);cursor:pointer;overflow:hidden;
        display:grid;place-items:center}
  .cell.over{background:var(--raise);box-shadow:inset 0 0 0 2px var(--chalk)}
  .cell img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cell .no{position:absolute;top:8px;left:9px;z-index:2;font-family:'IBM Plex Mono',monospace;
            font-size:10px;color:var(--chalk);text-shadow:0 1px 3px #000c;letter-spacing:.06em}
  .cell .role{position:absolute;bottom:8px;left:9px;right:9px;z-index:2;font:var(--label);
              letter-spacing:var(--track);text-transform:uppercase;color:#fff;
              text-shadow:0 1px 3px #000c}
  .cell .drop{color:var(--ink-faint);font-size:12px;text-align:center;padding:0 12px}
  .cell.primary .no,.cell.primary .role{color:var(--amber)}
  .cell .x{position:absolute;top:5px;right:5px;z-index:3;padding:2px 7px;font-size:11px;
           background:#000a;border-color:transparent;opacity:0;transition:opacity .12s}
  .cell:hover .x{opacity:1}

  .platefoot{display:flex;justify-content:space-between;align-items:center;
             padding-top:9px;font-family:'IBM Plex Mono',monospace;font-size:11px;
             color:var(--ink-faint)}

  /* ── result ────────────────────────────────────────────── */
  .stage{flex:1;min-height:0;border:1px solid var(--rule);background:
         repeating-conic-gradient(#232323 0% 25%,#1c1c1c 0% 50%) 50%/22px 22px;
         display:grid;place-items:center;position:relative;overflow:hidden}
  model-viewer{width:100%;height:100%;--poster-color:transparent}
  .stagemsg{text-align:center;padding:28px;max-width:340px}
  .stagemsg p{color:var(--ink-faint);font-size:13px;margin-top:6px}
  .err{color:var(--red);font-family:'IBM Plex Mono',monospace;font-size:12px;
       white-space:pre-wrap;text-align:left}
  .spinner{width:26px;height:26px;border:2px solid var(--rule-lit);border-top-color:var(--chalk);
           border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 14px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── verdict rail ──────────────────────────────────────── */
  .rail{border-top:1px solid var(--rule);background:var(--bench);
        padding:14px var(--pad);display:grid;grid-template-columns:auto 1fr;
        gap:10px 22px;align-items:start}
  .rail .lbl{padding-top:7px}
  .marks{display:flex;gap:8px}
  .mark{border:1px solid var(--rule);background:transparent;font-size:12px;padding:6px 16px;
        letter-spacing:.04em}
  .mark[aria-pressed="true"]{color:#151515;border-color:transparent;font-weight:600}
  .mark.good[aria-pressed="true"]{background:var(--chalk)}
  .mark.ok[aria-pressed="true"]{background:var(--amber)}
  .mark.no[aria-pressed="true"]{background:var(--red);color:#fff}
  .faults{display:flex;flex-wrap:wrap;gap:6px}
  .fault{border:1px solid var(--rule);background:transparent;color:var(--ink-dim);
         font-size:11.5px;padding:5px 11px;border-radius:2px}
  .fault[aria-pressed="true"]{background:var(--red);border-color:transparent;color:#fff}
  .exportrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .scalerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .scalerow input[type=number]{width:88px;text-align:right;
    font-family:'IBM Plex Mono',monospace}
  .scalerow select{max-width:172px}
  .scalerow .unit{color:var(--ink-faint);font-size:12px;margin-left:-4px}
  /* Amber, not red: an unsized model is not broken, it is unfinished. */
  #scalecm.unset{border-color:var(--amber)}
  .minitab{font:500 10px/1 'Archivo',sans-serif;letter-spacing:.09em;text-transform:uppercase;
           padding:5px 10px;background:transparent;color:var(--ink-dim)}
  .minitab[aria-pressed="true"]{background:var(--raise);border-color:var(--rule-lit);
           color:var(--chalk)}
  .stagetabs{display:flex;gap:4px}
  .hintline{font-size:12px;color:var(--ink-faint)}
  .hintline.warn{color:var(--amber)}
  .hintline.ok{color:var(--chalk)}
  .rail textarea{width:100%;min-height:34px;max-height:90px;resize:vertical;
                 background:var(--plate);font-size:13px}

  .viewtab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:7px 13px;
           background:transparent}
  .viewtab[aria-pressed="true"]{background:var(--raise);border-color:var(--rule-lit);color:var(--chalk)}
  #library{height:calc(100% - 54px);overflow:auto;padding:var(--pad);
           display:flex;flex-direction:column;gap:16px}
  .libbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .filters{display:flex;gap:6px;flex-wrap:wrap}
  .chip{font:500 12px/1 'Archivo',sans-serif;padding:7px 13px;border:1px solid var(--rule);
        background:var(--plate);color:var(--ink-dim);border-radius:99px;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--chalk);color:#151515;border-color:transparent;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
  .card{background:var(--bench);border:1px solid var(--rule);border-radius:3px;
        overflow:hidden;cursor:pointer;display:flex;flex-direction:column;text-align:left;
        padding:0;color:inherit}
  .card:hover{border-color:var(--rule-lit)}
  .card .shot{aspect-ratio:1;background:
      repeating-conic-gradient(#232323 0% 25%,#1c1c1c 0% 50%) 50%/18px 18px;
      display:grid;place-items:center;overflow:hidden}
  .card .shot img{width:100%;height:100%;object-fit:cover}
  .card .shot span{color:var(--ink-faint);font-size:11px}
  .card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px}
  .card b{font-weight:600;font-size:13px;line-height:1.3}
  .card .sub{font-family:'IBM Plex Mono',monospace;font-size:10.5px;color:var(--ink-faint)}
  .card .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
  .tagpill{font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;
           border-radius:99px;border:1px solid currentColor}
  .tagpill.shipping{color:var(--chalk)} .tagpill.review{color:var(--amber)}
  .tagpill.failed{color:var(--red)} .tagpill.ready,.tagpill.empty{color:var(--ink-faint)}
  .tagpill.running,.tagpill.optimising{color:var(--amber)}
  .v-good{color:var(--chalk)} .v-acceptable{color:var(--amber)} .v-reject{color:var(--red)}
  .empty{display:grid;place-items:center;height:100%;text-align:center;padding:40px}
  .empty h2{font-weight:600;font-size:15px;margin-bottom:8px}
  .empty p{color:var(--ink-faint);font-size:13px;max-width:380px}

  /* ── phone + tablet ──────────────────────────────────────
     Capture happens on a phone, so the bench has to work on one. Below 900px the
     specimen list becomes an off-canvas drawer and the two comparison panels stack:
     plate first (you are choosing frames), result under it (you are judging one). */
  .drawer-btn{display:none;padding:8px 12px;font-size:16px;line-height:1}
  .scrim{display:none}

  @media (max-width:900px){
    main{grid-template-columns:1fr}
    .drawer-btn{display:block}
    aside{position:fixed;inset:54px auto 0 0;width:262px;max-width:84vw;z-index:30;
          transform:translateX(-102%);transition:transform .22s ease;
          box-shadow:0 0 0 100vmax rgba(0,0,0,0);}
    body.drawer-open aside{transform:translateX(0)}
    .scrim{display:block;position:fixed;inset:54px 0 0 0;background:#000;opacity:0;
           pointer-events:none;transition:opacity .22s ease;z-index:29}
    body.drawer-open .scrim{opacity:.55;pointer-events:auto}
    .compare{grid-template-columns:1fr;overflow:visible}
    .plate{max-width:520px}
    .stage{min-height:290px}
    #status{max-width:150px}
  }

  @media (max-width:620px){
    :root{--pad:14px}
    header{height:auto;min-height:54px;flex-wrap:wrap;padding:9px var(--pad);gap:8px}
    main{height:auto;min-height:calc(100% - 54px)}
    aside{inset:0 auto 0 0;padding-top:66px}
    .scrim{inset:0}
    .bench{grid-template-rows:auto auto}
    .compare{padding:var(--pad);gap:16px}
    .rail{grid-template-columns:1fr;gap:6px 0;padding:14px var(--pad) 22px}
    .rail .lbl{padding-top:12px}
    .verdicts{flex-wrap:wrap}
    .verdicts button{flex:1 1 30%;min-height:44px}
    .fault{padding:9px 12px}          /* touch targets */
    button,select,input{min-height:40px}
    #variant,#engine{max-width:132px}
    #newvar{width:100%;order:10}
    .slot .lb{font-size:10px;padding:4px 6px}
    #status{width:100%;max-width:none;order:11}
  }

  /* the plate is square by design; keep it that way but never let it overflow */
  .plate{width:100%;max-width:min(100%,640px)}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<header>
  <button id="menu" class="drawer-btn" aria-label="Show dishes" aria-expanded="false">☰</button>
  <span class="wordmark">Scan<span>·</span>Studio</span>
  <button id="view-bench" class="viewtab" aria-pressed="true">Bench</button>
  <button id="view-lib" class="viewtab" aria-pressed="false">Library</button>
  <select id="variant" title="Angle strategy"></select>
  <button id="newvariant">New variant</button>
  <span class="sp"></span>
  <span id="status"></span>
  <select id="engine"></select>
  <button id="run" class="run">Run engine</button>
  <button id="export">Export</button>
</header>

<main>
  <aside>
    <span class="lbl">Specimens</span>
    <div id="specimens"></div>
    <button class="newdish" id="newdish">+ New dish</button>
  </aside>

  <div class="bench" id="bench"></div>
</main>
<div class="scrim" id="scrim"></div>

<section id="library" hidden>
  <div class="libbar">
    <span class="lbl">Everything made</span>
    <span class="sp"></span>
    <div class="filters" id="libfilters" role="group" aria-label="Filter">
      <button class="chip" data-f="all" aria-pressed="true">All</button>
      <button class="chip" data-f="shipping" aria-pressed="false">Shipping</button>
      <button class="chip" data-f="review" aria-pressed="false">Awaiting judgement</button>
      <button class="chip" data-f="good" aria-pressed="false">Good</button>
      <button class="chip" data-f="reject" aria-pressed="false">Rejected</button>
    </div>
    <span id="libcount" class="hintline"></span>
  </div>
  <div class="grid" id="libgrid"></div>
</section>

<template id="tpl-bench">
  <div class="compare">
    <section class="panel">
      <header>
        <span class="lbl">Input plate</span>
        <span class="lbl mono" id="filled" style="color:var(--ink-faint)"></span>
      </header>
      <div class="plate" id="plate"></div>
      <div class="platefoot">
        <span>Drop a photo, or click a cell to browse</span>
        <span id="platehint"></span>
      </div>
    </section>

    <section class="panel">
      <header>
        <span class="lbl">Result</span>
        <div class="stagetabs" id="stagetabs" hidden role="group" aria-label="Which file">
          <button class="minitab" data-stage="ship" aria-pressed="true">Shipping</button>
          <button class="minitab" data-stage="master" aria-pressed="false">Master</button>
        </div>
        <span class="sp"></span>
        <span class="lbl mono" id="resultmeta" style="color:var(--ink-faint)"></span>
      </header>
      <div class="stage" id="stage"></div>
    </section>
  </div>

  <div class="rail">
    <span class="lbl">Verdict</span>
    <div class="marks">
      <button class="mark good" data-v="good">Good</button>
      <button class="mark ok"   data-v="acceptable">Acceptable</button>
      <button class="mark no"   data-v="reject">Reject</button>
    </div>
    <span class="lbl">Fault</span>
    <div class="faults" id="faults"></div>
    <span class="lbl">Note</span>
    <textarea id="note" placeholder="What specifically went wrong, or why it works."></textarea>
    <span class="lbl">Real size</span>
    <div class="scalerow">
      <select id="shape" title="Proposes a starting number"></select>
      <select id="scaleaxis" title="Which dimension you are giving"></select>
      <input type="number" id="scalecm" min="1" max="200" step="0.5" placeholder="cm"
             aria-label="Size in centimetres">
      <span class="unit mono">cm</span>
      <span id="scalenote" class="hintline"></span>
    </div>
    <span class="lbl">Catalogue</span>
    <div class="exportrow">
      <button id="export-model">Re-optimise</button>
      <span id="exportnote" class="hintline"></span>
    </div>
  </div>
</template>

<input type="file" id="picker" accept="image/*" multiple hidden>

<script>
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const enc = encodeURIComponent;

let META = {}, LIST = [], CUR = null, DISH = null, VAR = 'default', PICK_SLOT = 0, POLL = null;
/* 'ship' or 'master'. Sticky across dishes on purpose: someone auditing whether the
   optimiser is eating garnish wants to stay on one side of the comparison. */
let STAGE = 'ship';

const api = (u, body) => fetch(u, body ? {
  method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
} : undefined).then(r => r.json());

/* What gets STORED, which is not the same question as what gets SENT.
   The photos bucket is the training corpus - the moat - and a dish cannot be reshot six
   months later, so keep well more detail here than any engine consumes today. 4096px at
   q0.95 lands around 3-4MB: cheap on R2, still plenty for a future fine-tune, and small
   enough that a phone can upload it. The engine gets its own, smaller cap server-side. */
const STORE_MAX_EDGE = 4096;
function prepare(file, max = STORE_MAX_EDGE) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s);
      c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      resolve(c.toDataURL('image/jpeg', 0.95));
    };
    img.onerror = () => reject(new Error(`${file.name} is not a readable image`));
    img.src = URL.createObjectURL(file);
  });
}

const say = t => $('#status').textContent = t;

async function boot() {
  META = await api('/api/meta');
  $('#engine').innerHTML = META.engines.map(e =>
    `<option value="${e.name}"${e.name === META.default_engine ? ' selected' : ''}>${e.name} · ${e.credits}cr</option>`).join('');
  await refresh();
  LIST.length ? open(LIST[0].dish, LIST[0].variants[0]) : renderEmpty();
}

async function refresh() {
  LIST = (await api('/api/dishes')).dishes;
  $('#specimens').innerHTML = LIST.map(d => `
    <button class="spec" data-dish="${d.dish}" aria-current="${d.dish === DISH}">
      <b>${d.dish}</b>
      <small>${d.variants.length} variant${d.variants.length === 1 ? '' : 's'}${d.judged ? ` · ${d.judged} judged` : ''}${d.shipping ? ` · ${d.shipping} shipping` : ''}</small>
    </button>`).join('');
}

function renderEmpty() {
  $('#bench').innerHTML = `<div class="empty"><div>
    <h2>No dishes yet</h2>
    <p>Make a dish, drop four photos into the plate, and run an engine.
       Nothing is read from your drive &mdash; only what you upload here.</p>
  </div></div>`;
  say('');
}

async function open(dish, variant) {
  DISH = dish; VAR = variant || 'default';
  CUR = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`);
  paint(); refresh();
}

/* How long the current optimise has been going. The server stamps `optimising_since`
   when it starts; a run that outlives its worker is only visible this way. */
const seconds = d => d.optimising_since
  ? Math.max(0, (Date.now() - Date.parse(d.optimising_since)) / 1000) : 0;
const elapsed = d => {
  const s = Math.round(seconds(d));
  if (!d.optimising_since) return '';
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m ${String(s % 60).padStart(2, '0')}s`;
};

function paint() {
  if (!$('#plate')) $('#bench').replaceChildren($('#tpl-bench').content.cloneNode(true));
  const d = CUR;

  const vs = [...new Set([...(d.all_variants || []), VAR])];
  $('#variant').innerHTML = vs.map(v => `<option${v === VAR ? ' selected' : ''}>${v}</option>`).join('');

  $('#plate').innerHTML = META.slots.map((name, i) => {
    const f = d.frames[i];
    const primary = i === 0 ? ' primary' : '';
    return `<div class="cell${primary}" data-slot="${i}">
      <span class="no mono">0${i + 1}</span>
      ${f ? `<img src="/frame?dish=${enc(DISH)}&variant=${enc(VAR)}&slot=${i}&v=${Date.now()}" alt="${name}">
             <button class="x" data-clear="${i}" title="Remove">Clear</button>` : ''}
      ${f ? '' : '<span class="drop">drop photo</span>'}
      <span class="role">${name}${i === 0 ? ' · primary' : ''}</span>
    </div>`;
  }).join('');

  $('#filled').textContent = `${d.filled} of 4`;
  $('#platehint').textContent = d.filled === 0 ? 'need at least one'
    : d.filled < 4 ? `${d.filled} of 4 — more frames, better model` : 'ready';

  const stage = $('#stage');
  if (d.status === 'running') {
    stage.innerHTML = `<div class="stagemsg"><div class="spinner"></div>
      <span class="lbl">Generating</span><p>Usually one to three minutes.</p></div>`;
    POLL ||= setInterval(async () => {
      const f = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`);
      if (f.status !== 'running') { clearInterval(POLL); POLL = null; CUR = f; paint(); refresh(); }
    }, 4000);
  /* `catalogued` and `exporting` are the old names for this state. Records written
     before the rename still carry them, and a record is not worth a migration.

     `optimising` is in here too, and that is the point: once generation has produced a
     master there is a model to look at, and making someone watch a spinner while a
     finished file sits in storage is just hiding it. The optimiser catches up in the
     background and the panel swaps to the shipping file when it lands. */
  } else if (['review', 'catalogued', 'exporting', 'optimising'].includes(d.status)
             && d.model_key) {
    // You judge what SHIPS, not the master. A master can look perfect while the optimiser
    // has quietly eaten the garnish, and at ~216 MB of VRAM against ~52 MB it is also not
    // the thing a guest's phone has to survive. The Master tab is there to tell the two
    // apart when a verdict is contested.
    const busy = d.status === 'optimising';
    const shippable = !!(d.catalog_keys && Object.keys(d.catalog_keys).length);
    /* While the optimiser runs, the master is the only file guaranteed to match this
       generation - the catalogue, if any, is from the previous pass. */
    const stg = (shippable && !busy) ? STAGE : 'master';
    stage.innerHTML = `<model-viewer src="/model?dish=${enc(DISH)}&variant=${enc(VAR)}&stage=${stg}&v=${d.catalogued_utc || d.seconds}"
      camera-controls auto-rotate rotation-per-second="18deg" shadow-intensity="1"
      exposure="1.1" interaction-prompt="none" alt="Generated model of ${DISH}"></model-viewer>`;
    const tabs = $('#stagetabs');
    tabs.hidden = !shippable || busy;
    $$('#stagetabs .minitab').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.stage === stg)));
    const st = d.export_stats || {};
    const dims = (st.size_after || []).map(v => (v * 100).toFixed(1)).join(' x ');
    $('#resultmeta').textContent = busy
      ? `master · optimising: ${d.stage || 'starting'}${elapsed(d) ? ' · ' + elapsed(d) : ''}`
      : stg === 'master'
        ? `master · ${d.engine} · ${d.seconds}s`
        : `${(st.draco_bytes/1048576||0).toFixed(2)} MB draco · ${st.result_triangles||'?'} tris${dims ? ` · ${dims} cm` : ''}`;
    if (busy) {
      POLL ||= setInterval(async () => {
        const f = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`);
        CUR = f;
        if (f.status !== 'optimising') { clearInterval(POLL); POLL = null; refresh(); }
        paint();
      }, 3000);
    }
  } else if (d.status === 'optimising') {
    stage.innerHTML = `<div class="stagemsg"><div class="spinner"></div>
      <span class="lbl">Optimising</span><p>${d.stage || 'starting'}</p></div>`;
    $('#stagetabs').hidden = true;
    $('#resultmeta').textContent = elapsed(d);
    POLL ||= setInterval(async () => {
      const f = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`);
      CUR = f;
      if (f.status !== 'optimising') { clearInterval(POLL); POLL = null; refresh(); }
      paint();
    }, 3000);
  } else if (d.status === 'failed') {
    stage.innerHTML = `<div class="stagemsg"><span class="lbl">Failed</span>
      <p class="err">${d.error || 'no detail returned'}</p></div>`;
    $('#resultmeta').textContent = d.engine || '';
    $('#stagetabs').hidden = true;
  } else {
    stage.innerHTML = `<div class="stagemsg"><span class="lbl">Nothing generated</span>
      <p>${d.filled === 0 ? 'Add at least one frame.' : 'Press Run engine.'}</p></div>`;
    $('#resultmeta').textContent = '';
    $('#stagetabs').hidden = true;
  }
  paintScale(d);

  $('#faults').innerHTML = META.faults.map(f =>
    `<button class="fault" data-f="${f}" aria-pressed="${(d.faults || []).includes(f)}">${f}</button>`).join('');
  $$('.mark').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === d.verdict));
  $('#note').value = d.note || '';
  $('#run').disabled = d.status === 'running' || d.filled < 1;

  /* Optimisation now runs itself after generation and after any size change, so this
     button is the retry and the manual re-run, not the thing that makes the catalogue. */
  const btn = $('#export-model'), note = $('#exportnote');
  if (btn) {
    const shippable = !!(d.catalog_keys && Object.keys(d.catalog_keys).length);
    const stuck = d.status === 'optimising' && seconds(d) > 180;
    btn.disabled = !d.model_key || d.status === 'running' ||
                   (d.status === 'optimising' && !stuck);
    btn.textContent = stuck ? 'Restart optimise' : 'Re-optimise';
    note.className = 'hintline';
    if (stuck) {
      note.textContent = `Stalled at "${d.stage || 'starting'}" for ${elapsed(d)}. ` +
        `The worker is gone — press Restart optimise.`;
      note.classList.add('warn');
    }
    else if (d.export_error) { note.textContent = d.export_error; note.classList.add('warn'); }
    else if (shippable) {
      const st = d.export_stats || {};
      note.textContent = `${(st.draco_bytes/1048576||0).toFixed(2)} MB shipping, ${st.shrink||'?'}x smaller than the master`;
      note.classList.add('ok');
    }
    else if (!d.model_key) note.textContent = '';
    else note.textContent = META.optimizer && META.optimizer !== 'none (masters kept, export unavailable)'
      ? `Toolchain: ${META.optimizer}` : 'No optimiser on this host — the master is kept regardless.';
  }
  say(`${DISH} / ${VAR} · ${d.status}`);
}

/* Real-world size. One dimension is enough - the model supplies the aspect ratio for
   the other two - so the question is which one the person happens to know. The shape
   picker only PROPOSES a number; every figure behind it is a guess (dataset.SHAPES) that
   ~30 real dishes are meant to replace. */
function paintScale(d) {
  const shape = $('#shape'), axis = $('#scaleaxis'), cm = $('#scalecm'), note = $('#scalenote');
  if (!shape) return;
  const sc = d.scale || {};
  if (!shape.options.length) {
    shape.innerHTML = '<option value="">Shape…</option>' +
      (META.shapes || []).map(s => `<option value="${s.id}">${s.label} · ${s.cm}cm</option>`).join('');
    axis.innerHTML = (META.scale_axes || []).map(a =>
      `<option value="${a}">${a === 'width' ? 'width / across' : a}</option>`).join('');
  }
  shape.value = sc.shape || '';
  axis.value = sc.axis || 'width';
  cm.value = sc.cm || '';
  cm.classList.toggle('unset', !sc.cm);

  note.className = 'hintline';
  const st = d.export_stats || {};
  const dims = (st.size_after || []).map(v => (v * 100).toFixed(1));
  /* The stats carry the size the SHIPPING file was actually built at. Compare it with
     what the record now says, or a number typed a second ago reads as already applied. */
  const applied = st.scale_cm === sc.cm && st.scale_axis === sc.axis;
  if (!sc.cm) {
    note.textContent = dims.length
      ? `Not set — shipping at ${dims.join(' x ')} cm, whatever the engine invented.`
      : 'Not set — this ships at whatever size the engine invented.';
    note.classList.add('warn');
  } else if (applied && dims.length) {
    note.textContent = `${dims.join(' x ')} cm on the table`;
    note.classList.add('ok');
  } else {
    note.textContent = `${sc.cm} cm ${sc.axis} — applied on the next optimise`;
  }
}

async function saveScale({shape, axis, cm}) {
  if (CUR && CUR.model_key) { CUR.status = 'optimising'; CUR.stage = 'queued'; paint(); }
  const r = await api('/api/scale', {dish: DISH, variant: VAR, shape, axis, cm});
  if (r.error) { say(r.error); CUR = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`); }
  else CUR = r;
  paint(); refresh();
}

const saveVerdict = () => api('/api/verdict',
  {dish: DISH, variant: VAR, verdict: CUR.verdict, faults: CUR.faults, note: $('#note').value});

async function upload(files, startSlot) {
  let slot = startSlot;
  for (const file of files) {
    if (slot > 3) { say('Plate is full — clear a cell to replace one'); break; }
    if (!file.type.startsWith('image/')) continue;
    say(`Preparing ${file.name}…`);
    try {
      CUR = await api('/api/upload',
        {dish: DISH, variant: VAR, slot, name: file.name, data: await prepare(file)});
      slot++;
    } catch (e) { say(e.message); }
  }
  paint(); refresh();
}

/* ── events ─────────────────────────────────────────────── */
document.addEventListener('click', async e => {
  const spec = e.target.closest('.spec');
  if (spec) {
    // Open a variant that exists. Defaulting to 'default' made saved work look lost:
    // a dish stored only as ring-25 would open an empty plate.
    const row = LIST.find(d => d.dish === spec.dataset.dish);
    return open(spec.dataset.dish, (row && row.variants[0]) || 'default');
  }

  const clear = e.target.closest('[data-clear]');
  if (clear) {
    CUR = await api('/api/clear-frame', {dish: DISH, variant: VAR, slot: +clear.dataset.clear});
    return paint();
  }

  const cell = e.target.closest('.cell');
  if (cell) { PICK_SLOT = +cell.dataset.slot; $('#picker').click(); return; }

  const mark = e.target.closest('.mark');
  if (mark) {
    CUR.verdict = CUR.verdict === mark.dataset.v ? '' : mark.dataset.v;
    paint(); return saveVerdict();
  }

  const fault = e.target.closest('.fault');
  if (fault) {
    CUR.faults ||= [];
    const i = CUR.faults.indexOf(fault.dataset.f);
    i < 0 ? CUR.faults.push(fault.dataset.f) : CUR.faults.splice(i, 1);
    paint(); return saveVerdict();
  }
});

document.addEventListener('dragover', e => {
  const cell = e.target.closest?.('.cell');
  if (!cell) return;
  e.preventDefault();
  $$('.cell').forEach(c => c.classList.toggle('over', c === cell));
});
document.addEventListener('dragleave', e => e.target.closest?.('.cell')?.classList.remove('over'));
document.addEventListener('drop', e => {
  const cell = e.target.closest?.('.cell');
  if (!cell) return;
  e.preventDefault();
  $$('.cell').forEach(c => c.classList.remove('over'));
  upload(e.dataTransfer.files, +cell.dataset.slot);
});

$('#picker').onchange = e => { upload(e.target.files, PICK_SLOT); e.target.value = ''; };
document.addEventListener('blur', e => { if (e.target.id === 'note') saveVerdict(); }, true);

$('#newdish').onclick = async () => {
  const name = prompt('Dish name');
  if (!name) return;
  DISH = name.trim(); VAR = 'default';
  CUR = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`);
  paint();
};
$('#newvariant').onclick = () => {
  if (!DISH) return say('Make a dish first');
  const v = prompt('Variant name — the angle strategy, e.g. ring-25');
  if (v) open(DISH, v.trim());
};
$('#variant').onchange = e => open(DISH, e.target.value);
$('#run').onclick = async () => {
  /* Paint first, await second. Jobs now run inside the request that starts them, so the
     response does not arrive until the work is finished - three minutes for a
     generation. Awaiting first would leave the panel blank for all of it. The record is
     what the poll reads, so progress shows either way. */
  CUR.status = 'running'; paint();
  const r = await api('/api/generate', {dish: DISH, variant: VAR, engine: $('#engine').value});
  if (r && r.error) { say(r.error); }
  CUR = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`);
  paint(); refresh();
};
const drawer = on => { document.body.classList.toggle('drawer-open', on);
  $('#menu').setAttribute('aria-expanded', String(on)); };
$('#menu').onclick = () => drawer(!document.body.classList.contains('drawer-open'));
$('#scrim').onclick = () => drawer(false);
addEventListener('keydown', e => { if (e.key === 'Escape') drawer(false); });

/* Delegated, because the rail is re-rendered from a template on every paint. */
document.addEventListener('change', e => {
  if (e.target.id === 'shape') {
    const s = (META.shapes || []).find(x => x.id === e.target.value);
    if (!s) return;
    return saveScale({shape: s.id, axis: s.axis, cm: s.cm});
  }
  if (e.target.id === 'scaleaxis' || e.target.id === 'scalecm') {
    const cm = parseFloat($('#scalecm').value) || 0;
    return saveScale({shape: $('#shape').value, axis: $('#scaleaxis').value, cm});
  }
});

document.addEventListener('click', async e => {
  const tab = e.target.closest('#stagetabs .minitab');
  if (tab) { STAGE = tab.dataset.stage; return paint(); }
  /* Delegated for a second reason: #export-model lives inside <template id="tpl-bench">,
     so binding it directly at parse time set .onclick on null, threw, and took every
     line after it - boot() included - down with it. The page loaded and did nothing. */
  if (e.target.id === 'export-model') {
    CUR.status = 'optimising'; CUR.stage = 'queued'; paint();
    const r = await api('/api/optimize', {dish: DISH, variant: VAR});
    if (r && r.error) say(r.error);
    CUR = await api(`/api/dish?dish=${enc(DISH)}&variant=${enc(VAR)}`);
    paint(); refresh();
  }
});

$('#export').onclick = async () => say('Wrote ' + (await api('/api/export')).csv);

let LIB = [], LIBFILTER = 'all';

async function loadLibrary() {
  LIB = (await api('/api/library')).items;
  paintLibrary();
}

function paintLibrary() {
  const f = LIBFILTER;
  const rows = LIB.filter(r =>
    f === 'all' ? true :
    f === 'shipping' ? r.shipping :
    f === 'review' ? (r.has_model && !r.verdict) :
    r.verdict === f);
  $('#libcount').textContent = `${rows.length} of ${LIB.length}`;
  $('#libgrid').innerHTML = rows.length ? rows.map(r => `
    <button class="card" data-d="${r.dish}" data-v="${r.variant}">
      <span class="shot">${r.has_thumb
        ? `<img loading="lazy" src="/thumb?dish=${enc(r.dish)}&variant=${enc(r.variant)}" alt="">`
        : '<span>no preview</span>'}</span>
      <span class="body">
        <b>${r.dish}</b>
        <span class="sub">${r.variant} · ${r.frames} frame${r.frames === 1 ? '' : 's'}${r.engine ? ' · ' + r.engine : ''}</span>
        <span class="row">
          <span class="tagpill ${r.shipping ? 'shipping' : r.status}">${r.shipping ? 'shipping' : r.status}</span>
          ${r.verdict ? `<span class="v-${r.verdict}">${r.verdict}</span>` : ''}
          ${r.draco_mb ? `<span class="sub">${r.draco_mb} MB</span>` : ''}
          ${r.scale && r.scale.cm ? `<span class="sub">${r.scale.cm}cm</span>`
            : '<span class="sub" style="color:var(--amber)">no size</span>'}
        </span>
        ${r.judged_by ? `<span class="sub">judged by ${r.judged_by}</span>` : ''}
      </span>
    </button>`).join('')
    : '<p class="hintline">Nothing here yet.</p>';
}

function showView(which) {
  const lib = which === 'library';
  $('#library').hidden = !lib;
  document.querySelector('main').style.display = lib ? 'none' : '';
  $('#view-lib').setAttribute('aria-pressed', String(lib));
  $('#view-bench').setAttribute('aria-pressed', String(!lib));
  if (lib) loadLibrary();
}

$('#view-lib').onclick = () => showView('library');
$('#view-bench').onclick = () => showView('bench');

document.addEventListener('click', e => {
  const chip = e.target.closest('#libfilters .chip');
  if (chip) {
    LIBFILTER = chip.dataset.f;
    document.querySelectorAll('#libfilters .chip').forEach(c =>
      c.setAttribute('aria-pressed', String(c === chip)));
    return paintLibrary();
  }
  const card = e.target.closest('.card');
  if (card) { showView('bench'); open(card.dataset.d, card.dataset.v); }
});

boot();
</script>
