<!-- Food & Market's kitchen picker, verbatim from the platform (extract_food_market.py). -->
<div id="fm-kitchen-landing">
        <div class="fm-kitchen-tiles">
            <button type="button" class="fm-kitchen-tile fm-kitchen-tile-georgian" data-kitchen="georgian">
                <img src="./img/food-market-georgian-more.png" alt="Food &amp; Market — Georgian &amp; More Kitchen" loading="eager">
            </button>
            <button type="button" class="fm-kitchen-tile fm-kitchen-tile-thai" data-kitchen="thai">
                <img src="./img/food-market-thai-tile.png" alt="Food &amp; Market — Thai Kitchen" loading="eager">
            </button>
            <button type="button" class="fm-kitchen-tile fm-kitchen-tile-japanese" data-kitchen="japanese">
                <div class="fm-jp-tile-art">
                    <span class="fm-jp-sun" aria-hidden="true"></span>
                    <img class="fm-jp-crane" src="./img/food-market/doodles/jp-crane-dark.png" alt="" aria-hidden="true">
                    <span class="fm-jp-kanji" lang="ja">折り紙</span>
                    <span class="fm-jp-title">ORIGAMI</span>
                    <span class="fm-jp-sub">JAPANESE KITCHEN</span>
                </div>
            </button>
            <button type="button" class="fm-kitchen-tile fm-kitchen-tile-drinks" data-kitchen="drinks">
                <img src="./img/food-market-drinks.png" alt="Food &amp; Market — Drinks" loading="eager">
            </button>
        </div>
    </div>
